name: UploadThing
slug: uploadthing
category: storage
brand_color: '#E91515'
logo: /logos/uploadthing.svg
summary: File upload API with 2 GB free storage, unlimited uploads/downloads, and 7-day audit logs.
tier_type: always-free
free_tier:
  - 2 GB storage
  - Unlimited uploads and downloads
  - Shared across all apps
  - 7-day audit log
  - ~10 file upload burst limit
paid_tier_highlights:
  - 100GB App at $10/mo with multi-region and private files
  - Usage-Based plan ($25/mo base + $0.08/GB) for high-volume apps
  - 30-day audit log on all paid tiers
  - Multi-region storage on both paid tiers
  - Private file management on paid tiers
