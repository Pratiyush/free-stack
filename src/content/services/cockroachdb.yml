name: CockroachDB
slug: cockroachdb
category: databases
subcategory: permanent
brand_color: '#6933FF'
logo: /logos/cockroachdb.svg

summary: 'Free monthly allowance (Postgres-compatible)'

tier_type: always-free

free_tier:
  - 'Free monthly allowance (Postgres-compatible)'
  - Clusters throttled after credits expire without payment method

paid_tier_highlights:
  - Basic adds usage above 50M RUs / 10 GiB at metered rates
  - Standard provisioned compute from $0.18/hr per 2 vCPUs
  - Advanced unlocks Azure, 99.999% SLA, PCI/HIPAA controls
  - CMEK, private connectivity, and DataDog export at Advanced
  - All tiers Postgres-compatible with multi-region support

pricing:
  - name: Basic
    price: 0
    unit: /month
    description: Smaller, bursty workloads up to 30K RU/sec (~60 vCPUs)
    features:
      - 50M RUs and 10 GiB storage free monthly
      - Scales to zero on-demand compute and storage
      - AWS and GCP multi-region (select regions)
      - 99.99% availability
      - Vector data integrated with transactional data
    billing: usage-based
  - name: Standard
    price: '$0.18/hr per 2 vCPUs'
    unit: per vCPU-hour
    description: Steady workloads at scale, up to 200 vCPUs
    features:
      - Provisioned compute, instant scaling to 200 vCPUs
      - On-demand storage
      - AWS and GCP multi-region (select regions)
      - Private connectivity available
      - 99.99% availability
    billing: usage-based
  - name: Advanced
    price: '$0.60/hr per 4 vCPUs'
    unit: per vCPU-hour
    description: High-scale apps with advanced security and compliance
    features:
      - Unlimited provisioned compute and storage scaling
      - AWS, GCP, and Azure multi-region (all regions)
      - Up to 99.999% availability
      - CMEK and PCI/HIPAA compliance controls
      - Private connectivity and DataDog export
    billing: usage-based

tags: []

