name: Framer
slug: framer
category: design
subcategory: permanent
brand_color: '#0055FF'
logo: /logos/framer.svg
summary: Framer — free tier; see the pricing page for details.
tier_type: free-plan
free_tier:
  - Free plan
  - >-
    Framer subdomain only (no custom domain), "Made in Framer" badge, 100 MB/mo bandwidth, 1,000 visitors/mo,
    non-commercial use only
paid_tier_highlights:
  - Basic at $10/site/mo unlocks custom domain and 10 GB bandwidth
  - Pro at $30/site/mo adds staging, RBAC, relational CMS
  - Scale at $100/site/mo enables events, funnels, priority support
  - Enterprise offers custom limits and dedicated support
pricing:
  - name: Free
    price: 0
    unit: /month
    billing: free
    description: Explore Framer as a design tool or create templates
    cta_url: https://www.framer.com/pricing
    features:
      - 10 CMS collections
      - 1,000 pages
      - 5 MB file uploads
      - One free locale
      - Up to 3 editors
      - Framer subdomain (no custom domain)
  - name: Basic
    price: 10
    unit: /site/month
    billing: annual
    description: Creative personal sites with custom domain
    cta_url: https://www.framer.com/pricing
    features:
      - Free custom domain
      - AI-powered design tools
      - Built-in SEO
      - 30 site pages
      - 10 GB monthly bandwidth
  - name: Pro
    price: 30
    unit: /site/month
    billing: annual
    description: Growing professional sites with staging and RBAC
    cta_url: https://www.framer.com/pricing
    features:
      - Staging and instant rollback
      - Roles and permissions
      - Relational CMS
      - 150 site pages
      - 100 GB monthly bandwidth
  - name: Scale
    price: 100
    unit: /site/month
    billing: annual
    description: Advanced, high-traffic sites with pay-per-use overage
    cta_url: https://www.framer.com/pricing
    features:
      - Custom locale regions
      - Events and funnels
      - Priority support
      - 300 site pages
      - 200 GB monthly bandwidth
  - name: Enterprise
    price: Custom
    description: Custom limits, enterprise security, dedicated support
    cta_url: https://www.framer.com/pricing
    features:
      - Custom limits
      - Enterprise security
      - Dedicated support
      - SLA available
      - SSO
