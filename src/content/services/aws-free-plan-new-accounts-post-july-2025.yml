summary: Credit-based free plan (6 months)
tier_type: free-plan
free_tier:
  - Up to $200 USD in AWS credits ($100 signup + up to $100 in milestones)
  - 6-month no-commitment window
  - Access to 30+ Always-Free services
  - No CC charge unless you upgrade to Paid Plan
  - Replaces 12-month trial for accounts created after July 15, 2025
paid_tier_highlights:
  - Convert to Paid Plan to unlock 150+ AWS services
  - Retain up to $200 in credits when upgrading
  - Pay-as-you-go pricing across all AWS services
  - Always-Free quotas still apply on Paid Plan
  - Reserved Instances and Savings Plans available for discounts
