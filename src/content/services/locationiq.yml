name: LocationIQ
slug: locationiq
category: maps
subcategory: permanent
brand_color: '#888888'
logo: /logos/locationiq.svg
summary: 5,000 requests/day (~150K/mo)
tier_type: free-plan
free_tier:
  - 5,000 requests/day (~150K/mo)
  - 2 requests/sec; 48-hr cache allowed
paid_tier_highlights:
  - Maps Lite at $45/mo unlocks 15 rps and commercial use
  - Developer at $100/mo provides 25K requests/day across all APIs
  - Startup at $200/mo delivers 60K/day plus priority support
  - Business Plus at $950/mo includes 30M requests and AWS endpoints
  - Enterprise scales up to 10 billion requests/day with custom SLAs
pricing:
  - name: Free
    price: 0
    unit: /month
    billing: free
    description: 5,000 requests/day for testing all APIs
    features:
      - Geocoding, Routing, and Maps APIs
      - 2 requests/sec
      - 48-hour cache allowed
      - Limited commercial use with attribution
      - No credit card required
    cta_url: https://locationiq.com/register
  - name: Maps Lite
    price: 45
    unit: /month
    billing: monthly
    description: Map-focused plan with 10,000 map views daily
    features:
      - Geocoding APIs
      - 15 requests/sec
      - Commercial use
      - Multiple access tokens
      - Email support
    cta_url: https://locationiq.com/pricing
  - name: Developer
    price: 100
    unit: /month
    billing: monthly
    description: All-API access with 25,000 requests/day
    features:
      - All three API types
      - 20 requests/sec
      - Soft daily limits (100% buffer)
      - Commercial use
      - Email support
    cta_url: https://locationiq.com/pricing
  - name: Startup
    price: 200
    unit: /month
    billing: monthly
    description: 60,000 daily requests with priority support
    features:
      - All APIs
      - 22 requests/sec
      - Priority email support
      - Unlimited map API rates
      - Soft daily limits
    cta_url: https://locationiq.com/pricing
  - name: Growth Plus
    price: 500
    unit: /month
    billing: monthly
    description: 7.5M monthly requests with flexible soft limits
    features:
      - All APIs
      - 30 requests/sec
      - No daily limits
      - Soft monthly limits (5-day buffer)
      - Priority support
    cta_url: https://locationiq.com/pricing
  - name: Business Plus
    price: 950
    unit: /month
    billing: monthly
    description: 30M monthly requests with live support and AWS endpoints
    features:
      - All APIs
      - 40 requests/sec
      - Priority live support
      - Dedicated AWS endpoints
      - SLA available
    cta_url: https://locationiq.com/pricing
  - name: Enterprise
    price: Custom
    billing: annual
    description: Up to 10 billion/day with dedicated infrastructure
    features:
      - Custom rates
      - Dedicated servers
      - Wire transfers accepted
      - Custom contracts and SLAs
      - 24/7 support
    cta_url: https://locationiq.com/contact
tags:
