name: Tolgee
slug: tolgee
category: translation
subcategory: permanent
brand_color: '#888888'
logo: /logos/tolgee.svg
summary: Free plan (permanent)
tier_type: free-plan
free_tier:
  - Free plan (permanent)
  - 3 seats on cloud free plan; open-source, self-hostable
paid_tier_highlights:
  - Team at EUR49/mo (annual) unlocks AI features + branching
  - Business at EUR179/mo adds webhooks + custom S3/Azure storage
  - Advanced at EUR499/mo scales to 20K keys + 20 seats
  - Enterprise unlocks SSO + ISO 27001 + dedicated Slack
  - Self-hosted available with monthly or annual licensing
pricing:
  - name: Free
    price: 0
    unit: /month
    description: 500 keys + 3 seats, no credit card required
    billing: free
    features:
      - 500 keys included
      - 3 seats included
      - Standard localization features
      - Machine translation automation
      - All Tolgee integrations (SDKs, Figma plugin)
    cta_url: https://app.tolgee.io/
  - name: Team
    price: 49
    unit: /month (EUR, billed annually)
    description: 2,000 keys + 4 seats; AI features included
    billing: annual
    features:
      - 2,000 keys included
      - 4 seats included
      - Auto translation and glossaries
      - Advanced AI features
      - Tasks and branching
      - Granular permissions
      - In-context translating
    cta_url: https://app.tolgee.io/
  - name: Business
    price: 179
    unit: /month (EUR, billed annually)
    description: 5,000 keys + 8 seats; pro translation support
    billing: annual
    features:
      - 5,000 keys included
      - 8 seats included
      - Professional translation support
      - Multiple content delivery configs
      - Webhooks integration
      - Custom content storage (S3, Azure)
      - AI customization
    cta_url: https://app.tolgee.io/
  - name: Advanced
    price: 499
    unit: /month (EUR, billed annually)
    description: 20,000 keys + 20 seats; prioritized requests
    billing: annual
    features:
      - 20,000 keys included
      - 20 seats included
      - All Business features
      - Prioritized feature requests
      - Advanced AI capabilities
      - Figma plugin support
    cta_url: https://app.tolgee.io/
  - name: Enterprise
    price: Custom
    description: SSO + ISO 27001 + dedicated Slack channel
    billing: annual
    features:
      - Custom key/seat limits
      - Single Sign-On (SSO)
      - Dedicated Slack channel
      - Account manager
      - ISO 27001 and GDPR compliant
      - Team training included
    cta_url: mailto:sales@tolgee.io
