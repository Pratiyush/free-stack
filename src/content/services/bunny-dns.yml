name: Bunny DNS
slug: bunny-dns
category: dns
brand_color: '#FF7A00'
logo: /logos/bunny-dns.svg
summary: DNS service with 20M free queries/mo, scriptable records, and monitoring included (requires $1/mo Bunny minimum).
tier_type: pay-as-you-go
free_tier:
  - First 20M standard queries/mo free
  - Scriptable DNS records
  - Built-in monitoring
  - All advanced features included
  - $1/mo minimum across Bunny services
paid_tier_highlights:
  - Standard queries beyond 20M billed at $0.10/M (no hidden fees)
  - Smart (scriptable) queries free up to 1M, then $0.30/M
  - $1/mo minimum across all Bunny services
  - All advanced features available at every tier
  - Pay-per-query — no setup fees, no plan tiers
pricing:
  - name: Free tier
    description: First 20M standard queries free
    price: 0
    billing: free
    features:
      - 20M free standard queries/mo
      - 1M free smart (scriptable) queries/mo
      - Scriptable DNS records
      - Built-in monitoring
      - All advanced features included
    cta_url: https://dash.bunny.net/account/register
  - name: Standard query overage
    description: Pay-per-query after 20M free
    price: 0.1
    unit: /M queries
    billing: usage-based
    features:
      - Same advanced features as free tier
      - Per-query pricing
      - No setup fees
      - Scales with usage
  - name: Smart (scriptable) overage
    description: Premium scriptable DNS after 1M free
    price: 0.3
    unit: /M queries
    billing: usage-based
    features:
      - Advanced query scripting
      - Per-usage billing
      - Enterprise capabilities
      - Scales on demand
