    billing: free
    features:
      - Unlimited publishing
      - Custom domain
      - Basic SSL
    cta_url: https://surge.sh/help/getting-started-with-surge
  - name: Surge Professional
    price: 30
    unit: /month
    description: Unlimited production-ready projects with custom SSL
    billing: monthly
    features:
      - Unlimited projects
      - Unlimited publishing
      - Custom domain + custom SSL
      - Force HTTP to HTTPS
      - Cross-Origin Resource Sharing
      - Custom redirects
      - Password protection
    cta_url: https://surge.sh/help/upgrading-to-surge-plus
