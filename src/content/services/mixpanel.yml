name: Mixpanel
slug: mixpanel
category: analytics
brand_color: '#7856FF'
logo: /logos/mixpanel.svg

summary: Event-based analytics with 1M events/mo on the free tier, 10K session replays, no credit card required.

tier_type: always-free

free_tier:
  - 1M events/month (free tier, capped)
  - 10K session replays/month
  - Unlimited reports
  - No group analytics or data export
  - Older accounts may be on legacy 20M plan

pricing:
  - name: Free
    price: 0
    unit: /month
    billing: free
    description: Capped at 1M monthly events; perpetual free tier
    features:
      - Up to 1M monthly events
      - 5 saved reports per seat
      - 10K monthly session replays
      - Basic analytics (insights, funnels, retention)
      - Slack community support
    cta_url: https://mixpanel.com/register/
  - name: Growth
    price: Usage
    billing: usage-based
    description: First 1M events free; $0.28 per 1K events thereafter
    features:
      - Up to 20M monthly events
      - Unlimited saved reports
      - 20K free session replays/mo (customizable to 500K)
      - Behavioral cohorts and multi-touch attribution
      - 60 Spark AI queries monthly
    cta_url: https://mixpanel.com/pricing/
  - name: Enterprise
    price: Custom
    billing: annual
    description: Unlimited events with advanced analytics and governance
    features:
      - Unlimited monthly events
      - 300 Spark AI queries monthly
      - HIPAA compliance tools and SAML SSO
      - Dedicated account manager
      - 24/7 premium support
    cta_url: https://mixpanel.com/contact-us/sales/

paid_tier_highlights:
  - Growth uses pay-as-you-go at $0.28 per 1K events past 1M free
  - Growth unlocks unlimited reports and behavioral cohorts
  - Spark AI queries available (60/mo Growth, 300/mo Enterprise)
  - Enterprise adds HIPAA, SAML SSO, and 24/7 premium support
  - Startup program offers first year free for qualifying companies

tags: [analytics, events, product-analytics, session-replay, cohorts]

official_url: https://mixpanel.com/
pricing_url: https://mixpanel.com/pricing/

date_added: 2026-05-15
date_updated: '2026-05-15'
date_verified: 2026-05-15
