name: '**1Password**'
slug: 1password
category: security
subcategory: permanent
brand_color: '#3B66BC'
logo: /logos/1password.svg
summary: Free for open-source teams
tier_type: free-plan
free_tier:
  - Free for open-source teams (via 1Password for Open Source program)
  - No general free tier; individual plans from $2.99/mo; 14-day trial otherwise
paid_tier_highlights:
  - Individual ($2.99/mo) adds password manager, autofill, breach alerts
  - Families ($4.99/mo) adds shared vaults for up to 5 members
  - Teams Starter Pack ($19.95/mo flat) covers up to 10 users
  - Business ($7.99/user/mo) adds SSO, custom policies, audit reports
  - Enterprise/MSP tier with dedicated console and consumption-based billing
pricing:
  - name: Free (Open Source)
    price: 0
    billing: free
    description: Free Teams plan for qualifying open-source projects
    features:
      - 1Password Teams plan at no cost
      - Up to 50 team members
      - Shared vaults for secrets
      - Activity logs and admin controls
      - Apply via 1Password for Open Source program
    cta_url: https://github.com/1Password/for-open-source
  - name: Individual
    price: 2.99
    unit: /month
    billing: monthly
    description: Personal password manager for one user
    features:
      - Unlimited passwords and items
      - Autofill across all devices
      - Watchtower breach alerts
      - Travel Mode and secure sharing
      - 1 GB document storage
    cta_url: https://start.1password.com/sign-up
  - name: Families
    price: 4.99
    unit: /month
    billing: monthly
    description: Shared vaults for up to 5 family members
    features:
      - Everything in Individual
      - Up to 5 family members included
      - Shared and private vaults
      - Account recovery for members
      - Guest accounts for occasional sharing
    cta_url: https://start.1password.com/sign-up/family
  - name: Teams Starter Pack
    price: 19.95
    unit: /month
    billing: monthly
    description: Flat-rate plan for small teams up to 10 users
    features:
      - Up to 10 team members
      - Unlimited shared vaults
      - Role-based access controls
      - Activity log and admin console
      - Developer tools integration
    cta_url: https://start.1password.com/sign-up/team
  - name: Business
    price: 7.99
    unit: /user/month
    billing: monthly
    description: Scalable plan with SSO and advanced admin controls
    features:
      - Everything in Teams Starter Pack
      - SSO via Okta/Azure AD/Duo
      - Advanced reporting and audit logs
      - Custom security policies
      - 5 GB document storage per user
      - Free family accounts for employees
    cta_url: https://start.1password.com/sign-up/business
  - name: Enterprise
    price: Contact sales
    billing: monthly
    description: Dedicated account management for large organisations
    features:
      - Everything in Business
      - Dedicated account manager
      - Onboarding engineer
      - Custom training and support
      - MSP edition available via Pax8
    cta_url: https://1password.com/business-pricing
tags:
  - security
  - permanent
  - free-plan
  - open-source
official_url: https://1password.com
pricing_url: https://1password.com/pricing
facets:
  oss: true
date_added: 2026-05-15
date_updated: '2026-05-16'
date_verified: '2026-05-16'
