      - Custom roles and teams
      - Annual contracts only
    cta_url: https://launchdarkly.com/contact-sales
  - name: Guardian
    price: Custom
    billing: annual
    description: Monitors and guards releases with automated rollback
    features:
      - Release Monitoring
      - Guardrail Metrics
      - Automatic Pause or Rollback
      - Advanced Observability
      - Exposure Insights
    cta_url: https://launchdarkly.com/contact-sales
