name: GitHub Pages
slug: github-pages
category: hosting
brand_color: '#181717'
logo: /logos/github-pages.svg
summary: Static site hosting with 1 GB size limit and 100 GB bandwidth/mo, no credit card required.
tier_type: always-free
free_tier:
  - 1 GB site size recommended
  - 100 GB bandwidth/mo (soft limit)
  - 10 builds/hr (soft limit)
  - Static sites only
  - Public repos only
paid_tier_highlights:
  - GitHub Pro at $4/user/mo unlocks private-repo Pages
  - GitHub Team at $4/user/mo brings same for organizations
  - GitHub Enterprise at $21/user/mo adds SAML SSO and SLA
  - Bandwidth limits are soft and identical across all tiers
pricing:
  - name: Free
    price: 0
    unit: /month
    billing: free
    description: Static hosting from public repos with 1 GB size and 100 GB bandwidth/mo
    cta_url: https://pages.github.com/
    features:
      - 1 GB site size (recommended)
      - 100 GB bandwidth/mo soft limit
      - 10 builds/hr soft limit
      - Static sites only
      - Public repos only
      - Custom domain with HTTPS
  - name: GitHub Pro
    price: 4
    unit: /user/month
    billing: monthly
    description: Unlocks private repo Pages publishing
    cta_url: https://github.com/pricing
    features:
      - Pages from private repos
      - Same 1 GB and 100 GB limits
      - Advanced auditing
      - Higher Codespaces and Actions quotas
  - name: GitHub Team
    price: 4
    unit: /user/month
    billing: monthly
    description: Organization plan supporting private-repo Pages
    cta_url: https://github.com/pricing
    features:
      - Pages from private org repos
      - Required reviewers and repo rules
      - Audit log
  - name: GitHub Enterprise
    price: 21
    unit: /user/month
    billing: monthly
    description: Private-repo Pages plus SAML SSO and compliance
    cta_url: https://github.com/pricing
    features:
      - Pages from private repos at org scale
      - SAML SSO
      - Premium support with 30-min SLA
      - SOC 2 / FedRAMP compliance
tags:
  - static-hosting
  - deployment
  - git
  - open-source
  - hosting
  - always-free
official_url: https://pages.github.com/
pricing_url: https://github.com/pricing
facets:
  bandwidth_gb_month: 100
date_added: '2026-05-15'
date_updated: '2026-05-16'
date_verified: '2026-05-16'
signup_friction:
  requires_cc: false
