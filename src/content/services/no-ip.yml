name: '**No-IP**'
slug: no-ip
category: dns
subcategory: permanent
brand_color: '#888888'
logo: /logos/no-ip.svg
summary: Free Dynamic DNS
tier_type: free-plan
free_tier:
  - Free Dynamic DNS
  - 1 hostname; 30-day renewal
paid_tier_highlights:
  - Hostnames never expire on paid plans (free requires 30-day renewal)
  - Custom domain support on Pro and above
  - RESTful API access on Premium Managed DNS
  - Priority phone support and SLA guarantees
  - SSL certificates bundled with paid tiers
pricing:
  - name: Free Dynamic DNS
    price: 0
    unit: /month
    billing: free
    description: Free dynamic hostname for remote access
    features:
      - Dynamic hostname updates
      - Remote device access
      - Basic DNS functionality
      - Requires 30-day renewal
      - Standard web support
    cta_url: https://www.noip.com/sign-up
  - name: Enhanced Dynamic DNS
    price: 29.99
    unit: /year
    billing: annual
    description: Reliable always-on remote access (personal)
    features:
      - 3-25 hostnames (tier-dependent)
      - 3-25 update clients
      - 1-3 SSL certificates
      - Anycast DNS network
      - Phone support (M-F)
    cta_url: https://www.noip.com/remote-access
  - name: Pro Dynamic DNS
    price: 149.99
    unit: /year
    billing: annual
    description: Business DDNS for 50-200 hostnames
    features:
      - 50-200 hostnames
      - 1-5 DNS zones
      - 5-50 SSL certificates
      - Anycast DNS network
      - MFA and team login
      - Phone support (M-F)
    cta_url: https://www.noip.com/remote-access
  - name: Plus Managed DNS
    price: 34.99
    unit: /year
    billing: annual
    description: Reliable DNS hosting for your own domains
    features:
      - 1-25 zones
      - Unlimited DNS records
      - 500k-12.5M queries/month
      - Anycast network (150+ POPs)
      - 1 SSL certificate
    cta_url: https://www.noip.com/managed-dns
  - name: Premium Managed DNS
    price: 99.99
    unit: /year
    billing: annual
    description: Enterprise-grade DNS with SLA
    features:
      - 1-25 zones
      - 1M-25M monthly queries
      - RESTful API access
      - Team login
      - Priority support with weekends
    cta_url: https://www.noip.com/managed-dns
  - name: White Label
    price: Custom
    billing: annual
    description: Customizable DDNS for OEMs and MSPs
    features:
      - Branded transactional emails
      - Anycast network (120+ POPs)
      - Custom domain management
      - End-customer support included
    cta_url: https://www.noip.com/solutions/chat-with-an-expert
