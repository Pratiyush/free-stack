logo: /logos/logto.svg
summary: Logto — free tier; see the pricing page for details.
tier_type: free-plan
free_tier:
  - Free plan
paid_tier_highlights:
  - Pro at $24/mo unlocks RBAC, MFA, and SAML/OIDC SSO
  - Pro adds multi-tenancy (Organizations) for B2B SaaS
  - Token usage billed at $0.08 per 100 beyond 50K free
  - Enterprise adds Private Cloud, SLA, and dedicated migration
  - Free tier supports up to 50K monthly active users
pricing:
  - name: Free
    price: 0
    unit: /month
    billing: free
    description: For starting out and trying Logto; no credit card
    features:
      - Up to 50,000 monthly active users
      - 50K tokens included
      - User authentication and M2M apps
      - Account APIs for settings management
      - Audit logs and user management
    cta_url: https://cloud.logto.io/sign-in
  - name: Pro
    price: 24
    unit: /month
    billing: monthly
    description: Worry-free auth for businesses
    features:
      - 50K free tokens, then $0.08 per 100 tokens
      - Role-based access control
      - Multi-tenancy (Organizations)
      - Multi-factor authentication
      - Enterprise SSO (SAML and OIDC)
    cta_url: https://logto.io/pricing
  - name: Enterprise
    price: Custom
    billing: annual
    description: Enterprise-grade requirements for large teams
    features:
      - Custom resource quotas and data regions
      - Private Cloud deployment option
      - SLA with guaranteed uptime
      - Premium priority support
      - Dedicated migration assistance
    cta_url: https://logto.io/contact
