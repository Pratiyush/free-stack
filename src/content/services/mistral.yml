name: Mistral AI
slug: mistral
category: ai-apis
subcategory: permanent
brand_color: '#FA520F'
logo: /logos/mistral.svg

summary: French LLM provider with free experiment tier, all models (Mistral Large, Codestral), and ~1B tokens/mo.

tier_type: always-free

free_tier:
  - ~1B tokens/month
  - All models available (Mistral Large, Codestral)
  - Phone verification required
  - ~1 RPS limit
  - 500K TPM

pricing:
  - name: Free
    price: 0
    unit: /month
    billing: free
    description: Personal AI assistant via Le Chat (free experiment tier)
    features:
      - Chat, search, and create with Le Chat
      - Access to all Mistral models
      - Up to 500 memories (beta)
      - Image generation capabilities
      - 40+ enterprise connectors
    cta_url: https://chat.mistral.ai/login
  - name: Pro
    price: 14.99
    unit: /month
    billing: monthly
    description: Enhanced productivity with higher limits and Mistral Vibe
    features:
      - Increased message and web search allowances
      - Extended thinking and deep research reports
      - Up to 15GB document storage
      - Mistral Vibe for coding support
      - Chat and email support
    cta_url: https://mistral.ai/pricing
  - name: Team
    price: 24.99
    unit: /user/month
    billing: monthly
    description: Collaborative workspace for team AI development
    features:
      - Up to 30GB storage per user
      - Domain name verification
      - Data export functionality
      - Admin API access
      - Audit logs
    cta_url: https://mistral.ai/pricing
  - name: Enterprise
    price: Custom
    billing: annual
    description: Private deployments with custom models and tools
    features:
      - Fully customizable solutions
      - White-label options
      - SAML SSO integration
      - Dedicated support
      - Custom deployment infrastructure
    cta_url: https://mistral.ai/contact

paid_tier_highlights:
  - Pro at $14.99/mo unlocks deep research and 15GB storage
  - Team at $24.99/user/mo adds admin API and audit logs
  - Mistral Vibe coding assistant included on Pro and above
  - Enterprise adds SAML SSO and white-label deployments
  - API access available separately via La Plateforme (per-token pricing)

tags: [llm, ai, api, mistral, models]

official_url: https://mistral.ai/
pricing_url: https://mistral.ai/pricing/

