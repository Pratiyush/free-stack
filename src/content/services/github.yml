name: '**GitHub**'
slug: github
category: dev-tools
subcategory: permanent
brand_color: '#181717'
logo: /logos/github.svg
summary: '**GitHub** — free tier; see the pricing page for details.'
tier_type: free-plan
free_tier:
  - Free plan
  - 5,000 API requests/hr (authenticated)
paid_tier_highlights:
  - Team at $4/user/mo expands CI/CD and packages quota, adds reviewers
  - Enterprise at $21/user/mo includes SAML SSO and compliance certifications
  - Both paid tiers add Codespaces and advanced auditing
  - Public repos remain unlimited and free on every tier
pricing:
  - name: Free
    price: 0
    unit: /month
    billing: free
    description: Unlimited public and private repos for individuals
    cta_url: https://github.com/pricing
    features:
      - Unlimited public and private repos
      - 2,000 CI/CD minutes/mo
      - 500 MB packages storage
      - Dependabot security updates
      - Issues and Projects
      - Community support
  - name: Team
    price: 4
    unit: /user/month
    billing: monthly
    description: Advanced collaboration for orgs
    cta_url: https://github.com/pricing
    features:
      - 3,000 CI/CD minutes/mo
      - 2 GB packages storage
      - Codespaces access
      - Required reviewers and code owners
      - Repository rules
      - Web-based support
  - name: Enterprise
    price: 21
    unit: /user/month
    billing: monthly
    description: Security, compliance, and flexible deployment
    cta_url: https://github.com/pricing
    features:
      - 50,000 CI/CD minutes/mo
      - 50 GB packages storage
      - SAML SSO and audit log
      - Enterprise Managed Users
      - Premium support 30-min SLA
      - SOC 2 / FedRAMP compliance
tags:
  - dev-tools
  - permanent
  - free-plan
  - api
official_url: https://github.com/
pricing_url: https://github.com/pricing
facets: {}
date_added: 2026-05-15
date_updated: '2026-05-16'
date_verified: '2026-05-16'
