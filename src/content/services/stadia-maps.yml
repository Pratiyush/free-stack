paid_tier_highlights:
  - Starter ($20/mo) unlocks commercial use and 1M credits
  - Standard ($80/mo) adds satellite basemaps and 7.5M credits
  - Professional ($250/mo) provides all basemaps and 25M credits
  - Overage rates decrease as tier scales ($0.015 vs $0.030 per 1K)

