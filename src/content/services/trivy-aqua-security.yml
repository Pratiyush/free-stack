free_tier:
  - Open-source (Apache 2.0)
  - Self-hosted only; Trivy Enterprise (paid) adds centralized management and compliance reporting
paid_tier_highlights:
  - Aqua Dev Security priced per code repository
  - Aqua Cloud Security priced per workload (EC2, Fargate, Lambda)
