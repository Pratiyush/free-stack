name: MapTiler
slug: maptiler
category: maps
subcategory: permanent
brand_color: '#323357'
logo: /logos/maptiler.svg
summary: Free cloud plan for non-commercial/R&D use
tier_type: free-plan
free_tier:
  - Free cloud plan for non-commercial/R&D use
  - No documented per-second limits
paid_tier_highlights:
  - Flex at $25/mo unlocks commercial use and 500K requests
  - Unlimited at $295/mo provides 5M requests with 99.9% SLA
  - 100 GB tile hosting included on Unlimited tier
  - Custom plans support volume discounts and unlimited hosting
  - All paid tiers include the static maps API
pricing:
  - name: Free
    price: 0
    unit: /month
    billing: free
    description: Custom maps for personal/non-commercial use
    features:
      - 100K API requests/month
      - 5K API sessions/month
      - 100 MB hosting capacity
      - Vector and XYZ raster tiles
      - Non-commercial use
    cta_url: https://www.maptiler.com/cloud/
  - name: Flex
    price: 25
    unit: /month
    billing: monthly
    description: Budget-friendly starter with commercial use
    features:
      - 500K API requests/month
      - 25K API sessions/month
      - 10 GB hosting across 10 files
      - Static maps API included
      - Commercial use allowed
    cta_url: https://www.maptiler.com/cloud/pricing/
  - name: Unlimited
    price: 295
    unit: /month
    billing: monthly
    description: Popular with businesses; enhanced capacity and reliability
    features:
      - 5M API requests/month
      - 300K API sessions/month
      - 100 GB hosting (1000 files max)
      - 99.9% SLA guarantee
      - Priority support
    cta_url: https://www.maptiler.com/cloud/pricing/
  - name: Custom
    price: Custom
    billing: annual
    description: Enterprise solution for high-traffic mapping
    features:
      - Custom request/session quotas
      - Unlimited hosting capacity
      - Volume discounts available
      - Soft-limit overuse model
      - Custom SLAs
    cta_url: https://www.maptiler.com/contacts/
