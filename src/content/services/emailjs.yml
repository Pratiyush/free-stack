name: EmailJS
slug: emailjs
category: email
brand_color: '#888888'
logo: /logos/emailjs.svg
summary: Free forever
tier_type: free-plan
free_tier:
  - Free forever
  - Not published
paid_tier_highlights:
  - Personal at $9/mo lifts the cap to 2,000 requests with white-label
  - Professional at $15/mo adds team seats and priority support
  - Business at $40/mo scales to 200K requests and 30 MB attachments
  - All paid tiers ship unlimited templates and contacts
pricing:
  - name: Free
    price: 0
    unit: /month
    billing: free
    description: Testing tier for evaluating EmailJS in a project
    features:
      - 200 monthly email requests
      - 2 email templates
      - Requests up to 50 KB
      - Limited contacts history
    cta_url: https://dashboard.emailjs.com/sign-up
  - name: Personal
    price: 9
    unit: /month
    billing: monthly
    description: Personal projects with branded sender and unlimited contacts
    features:
      - 2,000 monthly requests
      - 6 email templates
      - Whitelist support
      - Unlimited contacts
      - Attachments up to 500 KB
      - Completely white label
    cta_url: https://dashboard.emailjs.com/sign-up
  - name: Professional
    price: 15
    unit: /month
    billing: monthly
    description: Freelancers and entrepreneurs with team seats
    features:
      - 5,000 to 10,000 monthly requests
      - Unlimited templates and contacts
      - Attachments up to 2 MB
      - Suppressions list
      - 3 multi-user seats
      - Priority support
    cta_url: https://dashboard.emailjs.com/sign-up
  - name: Business
    price: 40
    unit: /month
    billing: monthly
    description: Small business scale with large attachments and unlimited seats
    features:
      - 25,000 to 200,000 monthly requests
      - Unlimited templates and contacts
      - Attachments up to 30 MB
      - Unlimited multi-user access
      - Priority support
    cta_url: https://dashboard.emailjs.com/sign-up
