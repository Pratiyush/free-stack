      - Spelling/grammar checking
      - Glossary management
      - Task management with custom statuses
    cta_url: https://lokalise.com/pricing/
  - name: Growth
    price: 499
    unit: /month
    billing: monthly
    description: Expanding teams with stronger automation
    features:
      - Everything in Explorer
      - Advanced automation triggers
      - In-context web/mobile editors
      - Workflow templates and customization
      - Analytics and translator statistics
    cta_url: https://lokalise.com/pricing/
  - name: Advanced
    price: 999
    unit: /month
    billing: monthly
    description: For teams with complex, multi-product workflows
    features:
      - Complete Growth features
      - Priority customer support
      - Custom AI profiles (RAG)
      - Dedicated account management
      - Workflow audit capabilities
    cta_url: https://lokalise.com/pricing/
  - name: Enterprise
    price: Custom
    billing: annual
    description: Global orgs with bespoke security and support needs
    features:
