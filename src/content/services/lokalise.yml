    features:
      - Basic project management
      - Collaborative web-based editor
      - Translation memory
      - 2FA security
      - 24/7 support access
    cta_url: https://app.lokalise.com/signup
  - name: Explorer
    price: 144
    unit: /month
    billing: monthly
    description: Essential localization package for efficient workflows
