name: '**Dependabot (GitHub)**'
slug: dependabot-github
category: security
subcategory: permanent
brand_color: '#025E8C'
logo: /logos/dependabot-github.svg

summary: Free for all repos

tier_type: free-plan

free_tier:
  - Free for all repos
  - 'Default: 5 open PRs at a time; custom auto-triage rules free on public repos only'

paid_tier_highlights:
  - Dependabot core remains free for public and private repos
  - GitHub Secret Protection at $19/active-committer/mo
  - GitHub Code Security at $30/active-committer/mo
  - Advanced auto-triage rules require Code Security
  - Add-ons unlock advanced SAST and secret-leak prevention

pricing:
  - name: Dependabot (Free)
    price: 0
    unit: /month
    description: Built-in vulnerability and version updates for all repos
    features:
      - Dependabot security updates
      - Dependabot version updates
      - 5 open PRs at a time (default)
      - Custom auto-triage on public repos
      - Works with GitHub Actions and Codespaces
    billing: free
  - name: GitHub Secret Protection
    price: 19
    unit: /active committer/month
    description: Stop secret leaks before code is pushed
    features:
      - Push protection for secrets
      - Secret scanning across history
      - Partner pattern detection
      - Audit log for secret alerts
    billing: monthly
  - name: GitHub Code Security
    price: 30
    unit: /active committer/month
    description: Identify and fix vulnerabilities before production
    features:
      - CodeQL static analysis
      - Auto-triage and security overview
      - Dependency review and SCA
      - SBOM exports
      - Custom auto-triage rules on private repos
    billing: monthly

tags: []

official_url: https://docs.github.com/
pricing_url: https://docs.github.com/en/code-security/dependabot

