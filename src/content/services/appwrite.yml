pricing:
  - name: Free
    price: 0
    billing: free
    description: For passion projects and small applications
    features:
      - 5 GB bandwidth, 2 GB storage per month
      - 750K executions, 75K MAU
      - 1 database, 1 bucket, 2 functions per project
      - 15-minute build timeouts
      - Community support only
    cta_url: https://cloud.appwrite.io/register
  - name: Pro
    price: 25
    unit: /month
    billing: monthly
    description: For production apps needing higher quotas
    features:
      - 2 TB bandwidth, 150 GB storage per month
      - 3.5M executions, 200K MAU
      - Unlimited databases, buckets, functions
      - Email support with organization roles
      - Daily backups (7-day retention)
      - 45-minute build timeouts
      - Add-ons for extra resources
    cta_url: https://cloud.appwrite.io/console?type=create&plan=tier-1
  - name: Enterprise
    price: Contact sales
    billing: annual
    description: Custom limits, compliance, 24/7 support
    features:
      - All Pro features plus custom limits
      - Uptime SLA and 24/7 support
      - SOC-2, HIPAA, BAA compliance
      - Designated success manager
      - Custom backup policies, 90-day log retention
      - SSO and custom org roles
    cta_url: https://cloud.appwrite.io/contact-us/enterprise
