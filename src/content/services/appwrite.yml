paid_tier_highlights:
  - 'Pro from $25/mo: 2 TB bandwidth, 150 GB storage, 200K MAU'
  - 'Pro: unlimited databases/buckets/functions and email support'
  - 'Pro: daily backups (7-day retention), 45-min build timeouts'
  - Enterprise adds SOC-2/HIPAA, SSO, 24/7 support, 90-day log retention
