name: 'ngrok'
slug: ngrok
category: dev-tools
subcategory: permanent
brand_color: '#1F1E37'
logo: /logos/ngrok.svg
summary: '**ngrok** — free tier; see the pricing page for details.'
tier_type: free-plan
free_tier:
  - Free plan
  - Interstitial warning page on free plan
paid_tier_highlights:
  - Paid plans remove interstitial warning pages and add TCP/TLS
  - Pay-as-you-go enables unlimited endpoints and team members
  - Enterprise unlocks SSO/RBAC, custom domains, dedicated support
  - Extended traffic inspector retention (72h vs 24h on free)
  - HIPAA BAA and SOC 2 only on Enterprise
pricing:
  - name: Free
    price: 0
    unit: /month
    billing: free
    description: Get online fast for testing
    features:
      - $5 included usage credit
      - Up to 3 online endpoints
      - 1 GB data transfer
      - 20k HTTP/S requests/month
      - Interstitial page on endpoints
      - 1 team member
    cta_url: https://dashboard.ngrok.com/signup
  - name: Hobbyist
    price: 8
    unit: /month
    billing: annual
    description: For solo devs, home labs, and game servers
    features:
      - $10 monthly included usage
      - Up to 3 online endpoints
      - 5 GB data transfer
      - 100k HTTP/S requests/month
      - No interstitial pages
      - 1 team member
    cta_url: https://dashboard.ngrok.com/billing/choose-a-plan
  - name: Pay-as-you-go
    price: 20
    unit: /month
    billing: usage-based
    description: Production-grade for teams shipping live traffic
    features:
      - $20 monthly included usage
      - Unlimited online endpoints
      - Unlimited data transfer
      - Unlimited HTTP/S requests
      - Unlimited team members
      - Custom domains and wildcards
    cta_url: https://dashboard.ngrok.com/billing/choose-a-plan
  - name: Enterprise
    price: Custom
    billing: annual
    description: Compliance, SSO/RBAC, dedicated support
    features:
      - SSO/RBAC
      - Region routing
      - HIPAA BAA available
      - SOC 2 verification
      - Dedicated support
      - Log exporting
    cta_url: https://ngrok.com/contact-sales
