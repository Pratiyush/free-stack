name: Read the Docs
slug: read-the-docs
category: documentation
subcategory: permanent
brand_color: '#8CA1AF'
logo: /logos/read-the-docs.svg
summary: Free for open-source (community)
tier_type: free-plan
free_tier:
  - Free for open-source (community)
  - Public/open-source projects only, ad-supported (EthicalAds)
paid_tier_highlights:
  - Basic ($50/mo) adds private docs with 2 concurrent builds
  - Advanced ($150/mo) brings custom domains and 4 builds
  - Pro ($250/mo) unlocks Google SSO and 15 custom domains
  - Enterprise (from $10K/yr) adds SAML SSO and dedicated build resources
pricing:
  - name: Community
    price: 0
    unit: /month
    billing: free
    description: Free for open-source projects with public docs
    features:
      - Public repository docs hosting
      - Ad-supported (EthicalAds)
      - Automatic builds and versioning
      - Pull request previews
      - CDN hosting
    cta_url: https://about.readthedocs.com/pricing/
  - name: Basic
    price: 50
    unit: /month
    billing: monthly
    description: Small teams starting with private documentation
    features:
      - 2 concurrent builds
      - Shared domain hosting
      - GitHub/GitLab SSO
      - 50 redirects
      - 30-day audit logs
    cta_url: https://about.readthedocs.com/pricing/
  - name: Advanced
    price: 150
    unit: /month
    billing: monthly
    description: Public docs on custom domains for growing teams
    features:
      - 4 concurrent builds
      - 5 custom domains
      - 250 redirects
      - 90-day analytics retention
      - 2 business day support
    cta_url: https://about.readthedocs.com/pricing/
  - name: Pro
    price: 250
    unit: /month
    billing: monthly
    description: Organizational scale and security requirements
    features:
      - 6 concurrent builds
      - 15 custom domains
      - GitHub, GitLab, Google SSO
      - 500 redirects
      - 1 business day support
    cta_url: https://about.readthedocs.com/pricing/
  - name: Enterprise
    price: Custom
    billing: annual
    description: Starts at $10,000/year; custom solutions
    features:
      - SAML SSO
      - Dedicated build resources
      - Advanced audit tracking
      - Support SLA
      - Tailored feature sets
    cta_url: https://about.readthedocs.com/pricing/
