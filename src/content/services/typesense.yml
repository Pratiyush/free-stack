name: Typesense Cloud
slug: typesense
category: search
brand_color: '#DA4167'
logo: /logos/typesense.svg

summary: Typo-tolerant search with a one-time 720-hour free trial (30 days continuous), no credit card required.

tier_type: free-plan

free_tier:
  - 720 hours cluster time (lifetime)
  - 10 GB bandwidth (lifetime)
  - One-time non-recurring allowance
  - No credit card required
  - ~30 days continuous use

pricing:
  - name: Free trial
    price: 0
    unit: lifetime
    billing: free
    description: One-time 720-hour trial cluster (~30 days)
    features:
      - 720 hours cluster time (lifetime)
      - 10 GB bandwidth (lifetime)
      - No credit card required
      - Full typo-tolerant search API
      - Dedicated cluster
    cta_url: https://cloud.typesense.org/
  - name: Dedicated Cluster (configurator)
    price: Usage
    billing: usage-based
    description: Configure RAM, vCPUs, HA, SDN; hourly rates per cluster
    features:
      - 0.5 GB – 1,024 GB RAM range
      - From 2 vCPUs with burst capacity
      - Optional GPU acceleration
      - Optional High Availability
      - No limits on records or operations
    cta_url: https://cloud.typesense.org/
  - name: Self-hosted (OSS)
    price: 0
    billing: free
    description: Run Typesense yourself; open source under GPLv3
    features:
      - Self-host on any infra
      - Full Typesense feature set
      - Community support
      - Docker images & binaries
      - No vendor limits
    cta_url: https://typesense.org/downloads/

paid_tier_highlights:
  - Configurable dedicated clusters with no record or operation limits
  - GPU acceleration and high-availability add-ons
  - Search Delivery Network (SDN) option for global edge replication
  - Algolia migration program with free consulting for $1k+/mo spenders
  - Free critical production support included on cloud clusters

tags: [search, typo-tolerance, full-text-search, api, open-source]

official_url: https://typesense.org/
pricing_url: https://cloud.typesense.org/pricing

maintainer_notes: 'Pricing page is a configurator (no fixed tiers). 720-hour trial confirmed at signup. Dedicated cluster cost depends on RAM/vCPU/HA selection.'

