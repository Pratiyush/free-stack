name: Spline
slug: spline
category: design
subcategory: permanent
brand_color: '#888888'
logo: /logos/spline.svg

summary: Spline — free tier; see the pricing page for details.

tier_type: free-plan

free_tier:
  - Free plan
  - 'Spline logo watermark on exports, no code/mobile exports, no version history, no video imports, no asset library'

pricing:
  - name: Free
    price: 0
    unit: /month
    billing: free
    description: Entry option with limited files and unlimited viewers
    features:
      - Limited file creation
      - Unlimited viewers
      - Web exports (with watermark)
      - Access to Spline Templates
      - Limited 2D editor files
    cta_url: https://spline.design/pricing
  - name: Starter
    price: 15
    unit: /seat/month
    billing: monthly
    description: Everything on Free plus unlimited files; $12 annual
    features:
      - Unlimited 3D and 2D files
      - Video upload capability
      - Watermark-free web exports
      - Higher-res image exports
      - Material and audio libraries
    cta_url: https://spline.design/pricing
  - name: Professional
    price: 25
    unit: /seat/month
    billing: monthly
    description: Most popular; $20 annual
    features:
      - Unlimited folders and projects
      - Video export functionality
      - Apple and Android exports
      - Audio upload and code exports
      - Unlimited variables, APIs, webhooks
      - Watermark-free web embeds
    cta_url: https://spline.design/pricing
  - name: Enterprise
    price: Custom
    billing: annual
    description: Team features and dedicated support
    features:
      - Centralized licensing and billing
      - Multiple teams with privacy
      - SAML SSO
      - Self-hosted exports and version history
      - Priority support and security onboarding
      - Optional custom AI credits
    cta_url: https://spline.design/pricing

paid_tier_highlights:
  - Starter ($15, $12 annual) unlocks unlimited files and video upload
  - Professional ($25, $20 annual) adds mobile and code exports
  - Professional brings unlimited APIs/webhooks
  - Enterprise provides SAML SSO and self-hosted exports

