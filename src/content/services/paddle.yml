summary: No monthly fee, Merchant of Record
tier_type: free-plan
free_tier:
  - No monthly fee, Merchant of Record
  - >-
    MoR model (Paddle is seller of record), handles all tax remittance, effective rate can be higher with 2-3% currency
    conversion margin on cross-currency payouts
paid_tier_highlights:
  - All-inclusive model - tax, compliance, billing, churn tools included
  - Automatic cross-border sales tax handling (MoR)
  - Built-in dunning management to recover failed payments
  - Migration support for existing subscriber base
  - Products under $10 or invoicing require custom pricing
pricing:
