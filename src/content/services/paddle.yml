    description: Merchant of Record with no monthly fees
    features:
      - 5% + 50¢ per checkout transaction
      - Cross-border sales tax compliance
      - Fraud and chargeback protection
      - No migration or monthly fees
      - Subscription management
      - Revenue recovery tools
      - 24/7 customer support
    cta_url: https://login.paddle.com/signup
  - name: Custom Pricing
    price: Custom
    billing: usage-based
    description: Tailored pricing for scaling and large businesses
    features:
      - All Pay-as-You-Go features
      - Optional premium services
      - Dedicated success management
      - Custom migration services
      - Implementation support
      - Advisory services
      - Invoicing capabilities
    cta_url: https://paddle.com/demo
