name: Neon
slug: neon
category: databases
brand_color: '#00E699'
logo: /logos/neon.svg
summary: Serverless Postgres with 100 free projects, auto-branching, and 100 CU-hours/mo per project.
tier_type: free-plan
free_tier:
  - 100 free projects
  - 0.5 GB storage per branch
  - 100 CU-hours/project/mo
  - 5 GB egress/mo
  - Auto-scale up to 2 CU with scale-to-zero
paid_tier_highlights:
  - Pay hourly for actual compute usage with no monthly minimum
  - 16+ CU capacity vs 2 CU max on Free tier
  - Up to 30-day history window with point-in-time restore
  - IP rules, private networking, SOC 2/HIPAA compliance
  - Up to 1,000 projects vs 100 on Free
pricing:
  - name: Free
    price: 0
    unit: /month
    billing: free
    description: Prototypes, side projects, and small teams
    features:
      - 100 CU-hours/project
      - 0.5 GB storage per project
      - Up to 2 CU autoscaling
      - 5 GB included network egress
      - Up to 60k Monthly Active Users
    cta_url: https://neon.com/signup
  - name: Launch
    price: Usage
    billing: usage-based
    description: Startups and growing teams with hourly metering
    features:
      - $0.106/CU-hour, $0.35/GB-month, $1.50/branch-month
      - Up to 16 CU autoscaling
      - 100 GB included egress
      - Up to 7-day history window
      - Scheduled snapshots
      - Up to 1M Monthly Active Users
    cta_url: https://neon.com/signup
  - name: Scale
    price: Usage
    billing: usage-based
    description: Production-grade workloads with advanced controls
    features:
      - $0.222/CU-hour, $0.35/GB-month, $1.50/branch-month
      - Up to 56 CU fixed or 16 CU autoscaling
      - Configurable scale-to-zero
      - 30-day history window
      - IP Allow rules and private networking
      - HIPAA/SOC 2 compliance available
    cta_url: https://neon.com/signup
  - name: Business
    price: Custom
    billing: usage-based
    description: Larger orgs needing higher quotas and enterprise features
    features:
      - Higher project and branch limits
      - SOC 2, HIPAA compliance
      - Private networking
      - SLA uptime guarantees
      - Priority support
    cta_url: https://neon.com/contact-sales
