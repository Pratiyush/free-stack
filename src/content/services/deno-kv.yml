pricing:
  - name: Free
    price: 0
    unit: /month
    description: Free KV storage with Deno Deploy Free
    features:
      - 1 GiB KV storage
      - 450K KV read units/mo
      - 300K KV write units/mo
      - Shared with Deno Deploy free tier
      - Auto-global, low-latency
    billing: free
  - name: Pro
    price: 20
    unit: /month
    description: Higher KV limits via Deno Deploy Pro
    features:
      - 5GB KV storage (then $0.75/GiB)
      - 1.3M KV read units/mo
      - 900K KV write units/mo
      - Includes Pro Deno Deploy quotas
    billing: monthly
  - name: Builder
    price: 200
    unit: /month
    description: Subhosting-scale KV via Deno Deploy Builder
    features:
      - 10 GiB KV storage (then $0.75/GiB)
      - 5M KV read units/mo
      - 3M KV write units/mo
      - Includes Builder Deno Deploy quotas
    billing: monthly
  - name: Enterprise
    price: Custom
    description: Custom KV allocations with SLA
    features:
      - Custom storage and request units
      - 99.95% reliability SLA
      - Dedicated support
    billing: annual
