pricing:
  - name: Free
    description: DNS, CDN, SSL, and DDoS protection at no cost
    price: 0
    billing: free
    features:
      - Unlimited zones
      - 200 DNS records/zone
      - Unlimited DNS queries
      - Unmetered DDoS mitigation
      - Universal SSL
      - 'API: 1,200 req/5min'
    cta_url: https://dash.cloudflare.com/sign-up
  - name: Pro
    description: For pro sites with security and performance
    price: 20
    unit: /mo
    billing: monthly
    features:
      - Everything in Free
      - WAF managed rulesets
      - Image optimization (Polish)
      - Mobile optimization
      - Lossless image optimization
      - Email support
  - name: Business
    description: Small ecommerce and business sites
    price: 200
    unit: /mo
    billing: monthly
    features:
      - Everything in Pro
      - 100% uptime SLA
      - Custom SSL certificate upload
      - PCI compliance support
      - 24/7 chat support
      - Advanced DDoS alerts
  - name: Enterprise
    description: Mission-critical apps with custom SLAs
    price: Contact sales
    billing: annual
    features:
      - Custom SLA + premium support
      - Advanced WAF + bot management
      - Premium routing (Argo)
      - Dedicated solutions engineer
      - Advanced certificate manager
