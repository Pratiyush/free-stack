name: Height
slug: height
category: project-management
subcategory: permanent
brand_color: '#888888'
logo: /logos/height.svg
summary: Free for up to 10 members
tier_type: free-plan
free_tier:
  - Free for up to 10 members
  - No documented rate limits
paid_tier_highlights:
  - Team at $6.99/user/mo lifts the 10-member cap and adds automations
  - Business at $11.99/user/mo adds audit log, API, and SSO
  - Enterprise adds SAML SSO, SCIM, and compliance reports
  - Free plan covers up to 10 members with unlimited projects
pricing:
  - name: Free
    price: 0
    unit: /month
    billing: free
    description: Free for small teams getting started with Height
    features:
      - Up to 10 members
      - Unlimited tasks, projects, and views
      - Real-time chat in every project
      - Calendar, list, spreadsheet, and Kanban views
      - Slack, GitHub, Figma, Notion integrations
    cta_url: https://height.app/signup
  - name: Team
    price: 6.99
    unit: /user/month
    billing: monthly
    description: For growing teams needing advanced workflow tools
    features:
      - Unlimited members
      - Custom attributes and forms
      - Advanced filters and saved views
      - Workflow automations and rules
      - Priority email support
    cta_url: https://height.app/signup
  - name: Business
    price: 11.99
    unit: /user/month
    billing: monthly
    description: For businesses needing scale, security, and audit
    features:
      - Everything in Team plus admin controls
      - Custom roles and permissions
      - Workspace audit log
      - Public API access
      - SSO via Google Workspace
    cta_url: https://height.app/signup
  - name: Enterprise
    price: Custom
    billing: annual
    description: For enterprises with SAML SSO and compliance needs
    features:
      - SAML SSO and SCIM provisioning
      - Custom data retention policies
      - Dedicated customer success manager
      - SOC 2 Type II reports
      - Custom contract and DPA
    cta_url: https://height.app/contact
