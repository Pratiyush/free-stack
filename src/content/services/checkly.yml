  - SMS + webhook alerting on Starter and above
  - Enterprise offers 1-second checks, parallel scheduling, SLAs
pricing:
  - name: Hobby
    description: Free for personal projects and learning
    price: 0
    billing: free
    features:
      - 10 uptime monitors
      - 1K browser/Playwright checks/mo
      - 10K API checks/mo
      - 6 global locations
      - Email and Slack alerting
    cta_url: https://app.checklyhq.com/signup
  - name: Starter
    description: Great for startups and growing projects
    price: 24
    unit: /mo
    billing: monthly
    features:
      - 50 uptime monitors
      - 3K browser checks/mo
      - 25K API checks/mo
      - 1-minute frequency
      - SMS + webhook alerting
      - 3 team members
  - name: Team
    description: Ideal for growing teams and businesses
    price: 64
    unit: /mo
    billing: monthly
    features:
      - 75 uptime monitors
      - 12K browser checks/mo
      - 100K API checks/mo
      - 30-second check frequency
      - All 22 global locations
      - 10 team members
      - Visual regression testing
  - name: Enterprise
    description: Custom solutions for large organizations
    price: Contact sales
    billing: annual
    features:
      - Custom monitors/check runs
      - 1-second check frequency
      - Parallel scheduling
      - Dedicated support
      - Enhanced security
