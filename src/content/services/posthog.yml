name: PostHog
slug: posthog
category: analytics
brand_color: '#1D4AFF'
logo: /logos/posthog.svg

summary: All-in-one product analytics with 1M events/mo, 5K session recordings, and an open-source self-host option.

tier_type: always-free

free_tier:
  - 1M events/mo
  - 5K session recordings/mo
  - Unlimited team members
  - 1 project
  - 1-year data retention

pricing:
  - name: Free
    price: 0
    unit: /month
    description: Generous monthly free tier; no credit card required
    features:
      - 1M events (Product Analytics)
      - 5K session recordings
      - 1M feature flag requests
      - 100K exceptions (Error Tracking)
      - 1,500 survey responses
      - 1 project, 1-year retention
    cta_url: https://app.posthog.com/signup
    billing: free
  - name: Pay-as-you-go
    price: Usage
    description: $0/mo under free tier; per-product usage billing
    features:
      - Same free tier limits reset monthly
      - Usage-based after free tier
      - 6 projects, 7-year data retention
      - Per-product billing limits
      - Email support (Slack over $2k/mo)
      - Unlimited team members and tracked users
    cta_url: https://app.posthog.com/signup
    billing: usage-based
  - name: Self-hosted (open source)
    price: 0
    description: MIT-licensed PostHog self-host; full features
    features:
      - Open-source MIT license
      - Run on your own infrastructure
      - No external usage limits
      - Community support
    cta_url: https://github.com/PostHog/posthog
    billing: free

paid_tier_highlights:
  - Free tier covers 1M events, 5K recordings, 1M flag requests, 100K exceptions
  - Pay-as-you-go uses same free tier and bills only overage per-product
  - Self-hosted open-source option for unlimited use
  - 6 projects and 7-year retention unlocked when on paid plan

tags: [analytics, product-analytics, session-replay, open-source, feature-flags]

official_url: https://posthog.com/
pricing_url: https://posthog.com/pricing

date_added: 2026-05-15
date_updated: '2026-05-15'
date_verified: 2026-05-15
