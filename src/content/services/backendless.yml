paid_tier_highlights:
  - 'Cloud Scale from $15/mo: unlimited API requests, 10 GB storage'
  - 'Scale plan adds free SSL, daily backups, team permissions'
  - 'Function Packs $5-$399/mo for storage, real-time, security extras'
