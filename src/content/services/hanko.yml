summary: Hanko — free tier; see the pricing page for details.
tier_type: free-plan
free_tier:
  - Free plan
paid_tier_highlights:
  - Pro at $29/mo adds 5 projects, SAML SSO add-on, and Admin API
  - $0.01 per MAU over the 10K bundled allotment
  - SAML SSO connections priced at $49/mo each on Pro
  - Enterprise unlocks unlimited projects and 99.99% SLA
pricing:
  - name: Starter
    price: 0
    unit: /month
    billing: free
    description: All you need to build a powerful login flow
    features:
      - 10,000 free monthly active users
      - 2 projects (paused when inactive)
      - Passkeys, passwords, passwordless authentication
      - Social SSO and multi-factor authentication
      - Custom domain and admin dashboard
    cta_url: https://www.hanko.io/
  - name: Pro
    price: 29
    unit: /month
    billing: monthly
    description: For teams building production apps
    features:
      - 10,000 MAUs included, $0.01 per additional MAU
      - 5 projects ($5/mo per additional)
      - SAML SSO at $49/mo per connection
      - Personal support via Slack/Discord
      - Webhooks, Admin API access, custom SMTP server
    cta_url: https://www.hanko.io/
  - name: Enterprise
    price: Custom
    billing: annual
    description: For B2C or B2B apps with high MAU counts or compliance needs
    features:
      - Unlimited projects
      - 99.99% SLA guarantee
      - Priority support tier
      - Extended audit log retention
      - Commercial license for private cloud deployment
    cta_url: https://www.hanko.io/contact
