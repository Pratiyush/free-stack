summary: Spark plan (free)
tier_type: always-free
free_tier:
  - Spark plan (free)
  - 50K reads/day, 20K writes/day, 20K deletes/day, resets midnight PT
  - 1 GiB total stored data
  - 10 GiB/mo network egress
  - No payment method required
paid_tier_highlights:
  - Blaze (Pay-as-you-go) preserves all Spark free quotas
  - Beyond free tier, Google Cloud pricing applies per operation/GB
  - Multiple databases per project on Blaze + Enterprise edition
  - 50K realtime update units/day included on Blaze
  - Eligible projects can receive $300 in free Google Cloud credit
