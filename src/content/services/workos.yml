logo: /logos/workos.svg
summary: Enterprise-grade auth with 1M free monthly active users, SSO, and MFA included at all tiers.
tier_type: free-plan
free_tier:
  - 1M monthly active users
  - MFA included at all tiers
  - Social login included
  - All core auth features
  - No credit card required
paid_tier_highlights:
  - Enterprise SSO from $125/connection/mo, volume discounts to $50
