      - Custom for 201+ connections
      - Enterprise-grade auth
      - JIT provisioning
    cta_url: https://workos.com/pricing
  - name: Directory Sync
    price: 125
    unit: /connection/month
    billing: monthly
    description: SCIM directory provisioning, volume discounts
