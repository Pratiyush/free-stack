  - name: Audit Logs
    price: 99
    unit: /month
    billing: monthly
    description: Streaming ($125) or retention ($99) audit logs
    features:
      - SIEM integration
      - Event streaming
      - Configurable retention
      - Compliance docs
      - $125/mo for streaming, $99/mo for retention
    cta_url: https://workos.com/pricing
