pricing:
  - name: Free (AuthKit)
    price: 0
    unit: /month
    billing: free
    description: First 1M monthly active users free
    features:
      - 1M MAU free
      - Email + password
      - Social login
      - Passkey support
      - MFA included
    cta_url: https://workos.com/sign-up
  - name: Pay-as-you-go
    price: Usage
    billing: usage-based
    description: Automatic volume discounts and dedicated Slack
    features:
      - Automatic volume discounts
      - Deploy in minutes
      - Dedicated Slack channel
      - All AuthKit features
      - Enterprise SSO available
    cta_url: https://workos.com/pricing
  - name: Enterprise SSO
    price: 125
    unit: /connection/month
    billing: monthly
    description: Per-connection SSO pricing with volume discounts
    features:
