paid_tier_highlights:
  - Free plan ships with 10K MAU, RBAC, 2FA, SSO/social login
  - Growth $150/mo adds SAML, impersonation, staging, M2M auth
  - Growth Plus $500/mo unlocks SCIM directory sync and 90-day audit logs
  - Additional MAU billed at $0.05 each on paid plans
pricing:
  - name: Free
    price: 0
    unit: /month
    description: Auth without limitations; up to 10,000 MAU included
    features:
      - 10,000 MAU included
      - Unlimited organizations
      - Unlimited waitlist users
      - Custom domain support
      - 2FA and RBAC
      - Password and passwordless auth, SSO/social login
    cta_url: https://auth.propelauth.com/en/signup
    billing: free
  - name: Growth
    price: 150
    unit: /month
    description: Adds user impersonation, SAML SSO, M2M auth
    features:
      - 10,000 MAU included (+$0.05/MAU)
      - User impersonation
      - Unlimited SAML/enterprise SSO
      - Separate staging environment
      - API keys and M2M authentication
      - MCP authentication support
    cta_url: https://auth.propelauth.com/en/signup
    billing: monthly
  - name: Growth Plus
    price: 500
    unit: /month
    description: SCIM directory sync and advanced org controls
    features:
      - 10,000 MAU included (+$0.05/MAU)
      - SCIM / directory sync
      - Advanced organization controls
      - Advanced security options
      - Unlimited role mappings
      - 90-day audit log retention
    cta_url: https://auth.propelauth.com/en/signup
    billing: monthly
