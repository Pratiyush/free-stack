      - Anonymous auth
      - Phone auth subject to SMS quotas
      - No payment method required
    cta_url: https://console.firebase.google.com/
  - name: Blaze (Pay-as-you-go)
    price: Usage-based
    billing: usage-based
    description: Pay only above the free MAU and SMS quotas
    features:
      - Identity Platform features available
      - SAML and OIDC SSO providers
      - Multi-factor auth (SMS or TOTP)
      - Blocking functions
      - Higher MAU limits
      - SMS billed per message
    cta_url: https://console.firebase.google.com/
