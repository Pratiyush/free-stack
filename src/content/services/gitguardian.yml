name: '**GitGuardian**'
slug: gitguardian
category: security
subcategory: permanent
brand_color: '#888888'
logo: /logos/gitguardian.svg
summary: Starter (free)
tier_type: free-plan
free_tier:
  - Starter (free)
  - 10K API calls/mo (rolling month); auto-trial starts if >25 devs
paid_tier_highlights:
  - Business tier adds custom detectors, SAML SSO, secrets manager integrations
  - Enterprise unlocks self-hosted deployment and NHI Governance
  - Both paid tiers expand beyond 25-dev free cap
  - Custom pricing — contact sales for quote
pricing:
  - name: Free
    price: 0
    unit: /month
    billing: free
    description: For individuals or up to 25 devs; no credit card required
    cta_url: https://www.gitguardian.com/pricing
    features:
      - Up to 25 developers
      - Unlimited real-time scanning
      - Up to 500 historical scan detections
      - Multi-VCS support (GitHub, GitLab, Azure, Bitbucket)
      - GitGuardian CLI (ggshield)
      - VSCode extension
  - name: Business
    price: Custom
    description: Recommended for teams up to 200 devs
    cta_url: https://www.gitguardian.com/pricing
    features:
      - Up to 20 teams
      - Remediation playbooks
      - Git repo scanning up to 12 GB
      - Custom regex-based detectors
      - Secrets manager integrations
      - SSO with SAML 2.0 and SCIM
  - name: Enterprise
    price: Custom
    description: Recommended for 200+ dev teams; self-hosted options
    cta_url: https://www.gitguardian.com/pricing
    features:
      - Internal Secrets, Public Secrets, NHI Governance
      - Self-hosted deployment (Helm or KOTS)
      - Unlimited teams, API calls, detectors
      - Dedicated support channel
      - Premium support add-on
