name: Firebase Storage
slug: firebase-storage
category: storage
subcategory: permanent
brand_color: '#DD2C00'
logo: /logos/firebase-storage.svg
summary: 5 GB stored (Blaze plan required since Feb 2026)
tier_type: free-plan
free_tier:
  - 5 GB stored (Blaze plan required since Feb 2026)
  - Blaze plan mandatory; no-cost usage preserved on *.appspot.com buckets
paid_tier_highlights:
  - Blaze plan mandatory for Cloud Storage as of Feb 2026
  - Storage billed at $0.026/GB-month above free tier
  - Egress billed at $0.12/GB downloaded
  - Multiple buckets per project on Blaze
pricing:
  - name: Spark (Legacy free quotas on Blaze)
    price: 0
    unit: /month
    billing: free
    description: 5 GB no-cost usage retained on Blaze for legacy buckets
    features:
      - 5 GB stored (no-cost tier on *.appspot.com)
      - 1 GB/day download
      - 20K upload, 50K download operations/day
      - Blaze plan required since Feb 2026
      - Hard cap removed (metered after free)
    cta_url: https://console.firebase.google.com/
  - name: Blaze (Pay-as-you-go)
    price: Usage-based
    billing: usage-based
    description: Metered storage and egress beyond the free thresholds
    features:
      - $0.026/GB stored per month
      - $0.12/GB downloaded
      - $0.05 per 10K upload operations
      - $0.004 per 10K download operations
      - Multiple buckets per project
      - Required for any Cloud Storage usage
    cta_url: https://console.firebase.google.com/
tags:
