name: MotherDuck
slug: motherduck
category: databases
subcategory: permanent
brand_color: '#888888'
logo: /logos/motherduck.svg

summary: Free plan (cloud DuckDB)

tier_type: always-free

free_tier:
  - Free plan (cloud DuckDB)
  - Hard cap on storage and compute; no overage on free plan

pricing:
  - name: Lite
    price: 0
    unit: /month
    billing: free
    description: For solo practitioners and hobbyists
    features:
      - Up to 3 internal active users, 2 service accounts
      - 10 GB free storage
      - 10 hrs Pulse compute/month
      - Community support
      - 1-day snapshot retention
    cta_url: https://app.motherduck.com/
  - name: Business
    price: 250
    unit: /org/month
    billing: monthly
    description: Production analytics + usage-based compute and storage
    features:
      - Up to 10 internal active users, unlimited service accounts
      - 5 instance types with read-scaling replicas
      - 90-day snapshot retention
      - Query history access
      - 99.9% availability SLA
      - Expert support with response SLA
    cta_url: https://app.motherduck.com/
  - name: Enterprise
    price: Custom
    billing: monthly
    description: Custom plans for large-scale deployments
    features:
      - Unlimited internal users and service accounts
      - Fixed-cost capacity pricing
      - AWS PrivateLink connectivity
      - HIPAA BAA available
      - All Business plan features
      - Customizable SLA
    cta_url: https://motherduck.com/contact-us/product-expert/

paid_tier_highlights:
  - Multiple compute instance types for scalable workloads
  - SSO, SCIM, SOC 2 Type II, GDPR, optional HIPAA BAA
  - Database sharing, Dives visualizations, FixIt error resolution
  - Expert support with guaranteed response SLAs
  - 90-day snapshot retention vs 1-day on Free

tags: []

