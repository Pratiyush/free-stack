name: Zeplin
slug: zeplin
category: design
subcategory: permanent
brand_color: '#FDBD39'
logo: /logos/zeplin.svg
summary: Zeplin — free tier; see the pricing page for details.
tier_type: free-plan
free_tier:
  - Free plan
  - 30-day version history, only owner can upload designs on free plan
paid_tier_highlights:
  - Basic from $13.75/mo (annual) per project, no seat fees
  - Advanced at $12/seat/mo for 50 projects + granular roles
  - Permanent version history on Advanced and above
  - Enterprise adds SSO, MFA, SCIM, and 24-hour priority SLA
  - All paid plans extend version history beyond Free's 30 days
pricing:
  - name: Free
    price: 0
    unit: /month
    billing: free
    description: One flat fee, unlimited designers and devs
    features:
      - 1 project
      - Unlimited users on the project
      - 100 screens to begin
      - 3 AI design reviews per week
      - 30-day version history
    cta_url: https://app.zeplin.io/signup
  - name: Basic
    price: 13.75
    unit: /month annual
    billing: monthly
    description: Flat rate per project, no per-seat costs
    features:
      - 1-12 projects available
      - Unlimited team members per project
      - 1,000 screens per project
      - 20 weekly AI design reviews
      - 1-year version history
    cta_url: https://zeplin.io/pricing/
  - name: Advanced
    price: 12
    unit: /seat/month annual
    billing: monthly
    description: Manage all projects and members in one place
    features:
      - 50 projects with unlimited screens
      - 4 user roles, granular permissions
      - Unlimited complimentary reviewers
      - Flow boards, permanent version history
      - Team workspace tools
    cta_url: https://zeplin.io/pricing/
  - name: Enterprise
    price: Custom
    billing: monthly
    description: Compliance controls for large organizations
    features:
      - Unlimited projects and screens
      - SSO, MFA, SCIM provisioning
      - Invoiced billing
      - Activity logging, success manager
      - 24-hour priority support SLA
    cta_url: https://zeplin.io/contact-sales/
tags:
