      - 1M tokens/day free
      - Access to all Cerebras-powered models
      - 20x faster inference than OpenAI/Anthropic
      - Llama 3.1 8B, Qwen 3 32B/235B
      - Community Discord support
    cta_url: https://cloud.cerebras.ai/
  - name: Developer
    description: Self-serve paid tier, 10x higher rate limits
    price: 10
    unit: /mo (starts at)
    billing: usage-based
    features:
      - Everything in Free
      - 10x higher rate limits
      - Higher priority processing
      - Pay-as-you-go scaling
  - name: Cerebras Code Pro
    description: Coding-focused token plan for indie devs
    price: 50
    unit: /mo
    billing: monthly
    features:
      - Up to 24M tokens/day
      - Top open source model access
      - Fast, high-context completions
      - Indie + weekend project focus
  - name: Cerebras Code Max
    description: Heavy-duty coding workflows
    price: 200
    unit: /mo
    billing: monthly
    features:
