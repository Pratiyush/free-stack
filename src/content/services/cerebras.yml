      - Multi-agent system support
      - Full-time development use
  - name: Enterprise
    description: Dedicated capacity + custom model support
    price: Contact sales
    billing: annual
    features:
      - Highest rate limits
      - Lowest latency dedicated queue
      - Custom model weights
      - Fine-tuning + training services
      - Guaranteed response times
