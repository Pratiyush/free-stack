summary: Ultra-fast inference with 1M tokens/day free, Llama and Qwen models, and ~2,600 tokens/sec speed.
tier_type: always-free
free_tier:
  - 1M tokens/day free
  - Llama 3.1 8B available
  - Qwen 3 32B/235B available
  - Ultra-fast inference (~2,600 tok/sec)
