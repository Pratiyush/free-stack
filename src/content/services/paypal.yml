name: PayPal
slug: paypal
category: payments
subcategory: permanent
brand_color: '#002991'
logo: /logos/paypal.svg
summary: No monthly fee (standard)
tier_type: free-plan
free_tier:
  - No monthly fee (standard)
  - +1.5% for international transactions, dispute fees apply, widely recognized checkout
paid_tier_highlights:
  - No monthly account fee; pay only per-transaction
  - PayPal Checkout 2.99% + $0.49; Expanded Checkout 2.89% + $0.29
  - In-person (Card Present / Tap to Pay) 2.29% + $0.09
  - Invoices 3.49% + $0.49; Pay Later invoices 4.99% + $0.49
  - High-volume enterprise on custom interchange-plus pricing
pricing:
  - name: Free (account)
    price: 0
    unit: /month
    description: No monthly fee for a PayPal Business account
    features:
      - No monthly account fee
      - Pay per-transaction only
      - Seller Protection on eligible sales
      - Access to Checkout, Invoices, Virtual Terminal
    cta_url: https://www.paypal.com/us/business
    billing: free
  - name: PayPal Checkout
    price: 2.99% + $0.49
    unit: /transaction
    description: Standard online checkout with cards, PayPal, Venmo
    features:
      - Credit/debit card acceptance
      - PayPal and Venmo payment options
      - Pay Later financing available
      - Seller Protection on eligible transactions
    cta_url: https://www.paypal.com/unifiedonboarding/entry?products=checkout
    billing: usage-based
  - name: Expanded Checkout
    price: 2.89% + $0.29
    unit: /transaction
    description: Cards, Apple Pay, Google Pay with custom risk controls
    features:
      - Multiple payment method support
      - Advanced fraud management tools
      - Customizable checkout flow
      - Lower per-transaction fees
    cta_url: https://www.paypal.com/unifiedonboarding/entry?products=checkout
    billing: usage-based
  - name: In-Person (Card Present / Tap to Pay)
    price: 2.29% + $0.09
    unit: /transaction
    description: POS card reader, terminal, or phone Tap to Pay
    features:
      - Card reader ($29) or terminal ($199)
      - QR code and Tap to Pay support
      - Real-time POS processing
    cta_url: https://www.paypal.com/unifiedonboarding/entry?products=ZETTLE
    billing: usage-based
  - name: PayPal/Venmo Invoices
    price: 3.49% + $0.49
    unit: /transaction
    description: Send invoices payable by PayPal/Venmo
    features:
      - Instant payment capability
      - Venmo payment option
      - No PayPal account required by payer
    cta_url: https://www.paypal.com/bizsignup/entry?product=invoicing
    billing: usage-based
  - name: High-Volume / Enterprise
    price: Custom
    description: Interchange-plus pricing for high-volume merchants
    features:
      - Custom fee negotiation
      - Interchange plus model
      - Dedicated support
    cta_url: https://www.paypal.com/us/business/contact-sales
    billing: usage-based
tags:
  - payments
  - permanent
  - free-plan
official_url: https://www.paypal.com/
pricing_url: https://www.paypal.com/us/business/pricing
