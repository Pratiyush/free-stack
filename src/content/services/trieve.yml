name: Trieve
slug: trieve
category: search
brand_color: '#A33EB5'
logo: /logos/trieve.svg
summary: Search and vector database with 1 GB free ingestion, 1M searches/mo, and 5-year analytics retention.
tier_type: always-free
free_tier:
  - First 1 GB ingested free
  - First 1M searches/mo free
  - First 1M messages/mo free
  - 5-year analytics retention
  - Usage-based after free tier
paid_tier_highlights:
  - Pay-as-you-go $5/mo platform fee + metered usage
  - Chunk storage $132 per 1M ($12.07/GB)
  - Write/search tokens $0.028 per 1M
  - OCR $0.01/page, crawl $0.00086/page
  - Enterprise unlocks dedicated cloud + bulk discounts
pricing:
  - name: Free Tier
    price: 0
    unit: /month
    description: Generous starter for testing and development
    billing: free
    features:
      - 1,000 chunks (11 MB storage)
      - 10 GB file storage
      - 2 datasets
      - 3M write tokens/mo
      - 3M search tokens/mo
      - 100 free OCR pages/mo
      - First 5 users included
    cta_url: https://dashboard.trieve.ai/auth/sign-up
  - name: Pay-as-you-go
    price: 5
    unit: /month platform fee + usage
    description: $0.028/1M write or search tokens, $12.07/GB chunks
    billing: usage-based
    features:
      - $5/user beyond first 5
      - Chunk storage $132 per 1M chunks
      - File storage $0.046/GB
      - Datasets $0.05 each
      - Write/Search tokens $0.028 per 1M
      - OCR $0.01/page; crawl $0.00086/page
      - Bytes ingested $2/GB beyond 1GB
    cta_url: https://dashboard.trieve.ai/auth/sign-up
  - name: Enterprise
    price: Custom
    description: Dedicated cloud with SLA guarantees
    billing: annual
    features:
      - Dedicated cloud deployment
      - SLA guarantees
      - Bulk discounts for large scale
      - Priority support
    cta_url: https://www.trieve.ai/contact
