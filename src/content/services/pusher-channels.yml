paid_tier_highlights:
  - Sandbox free with 200K msgs/day and 100 connections (dev/test only)
  - Startup $49/mo (1M msgs, 500 conn); Pro $99/mo (4M msgs, 2K conn)
  - Business $299/mo and Premium $499/mo add premium support and SLAs
  - Growth/Plus/Growth Plus scale to 90M msgs/day at $1,199/mo
  - Enterprise tier handles 100B msgs/day with custom SLA and pricing

