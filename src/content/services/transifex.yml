  - name: Starter
    price: 135
    unit: /month (annual, from)
    description: Essentials for individuals + small teams
    billing: annual
    features:
      - Unlimited projects and files
      - Translation Memory
      - Machine translation support
      - Online editor + collaboration
      - Git, Figma, Zendesk integrations
      - API, SDKs, CLI, webhooks
    cta_url: https://app.transifex.com/signup/
  - name: Growth
    price: 200
