name: Ably
slug: ably
category: communication
subcategory: permanent
brand_color: '#888888'
logo: /logos/ably.svg

summary: Free plan (permanent)

tier_type: free-plan

free_tier:
  - Free plan (permanent)
  - No time limit on free tier; messages counted by publish + delivery
  - 6M messages/month, 200 concurrent connections, 500 msgs/sec peak

paid_tier_highlights:
  - 'Standard ($29/mo + usage) lifts to 10k connections and 2.5k msgs/sec'
  - 'Pro ($399/mo + usage) scales to 50k connections and 10k msgs/sec'
  - 'Paid tiers add uptime SLOs and email-support SLAs (1 day / 4 hour)'
  - 'Enterprise adds 99.999% SLA, HIPAA BAA, SSO/SCIM, 24/7 support'

pricing:
  - name: Free
    price: 0
    billing: free
    description: Build a proof of concept with capped capacity
    features:
      - 6M messages/month
      - 200 concurrent connections
      - 500 messages/second peak
      - All Ably products included
      - Community and best-effort email support
    cta_url: https://ably.com/sign-up
  - name: Standard
    price: 29
    unit: /month + usage
    billing: usage-based
    description: Production-ready tier with email-support SLA
    features:
      - 10k concurrent channels and connections
      - 2.5k messages/second peak
      - 1-day email support SLA
      - Uptime SLO included
      - All Ably products included
    cta_url: https://ably.com/users/paid_sign_up?package=standard
  - name: Pro
    price: 399
    unit: /month + usage
    billing: usage-based
    description: Scale business-critical workloads
    features:
      - 50k concurrent channels and connections
      - 10k messages/second peak
      - 4-hour email support SLA
      - Datadog (lite) integration
      - Uptime SLO included
    cta_url: https://ably.com/users/paid_sign_up?package=pro
  - name: Enterprise
    price: Contact sales
    billing: usage-based
    description: Unlimited capacity with mission-critical support
    features:
      - Unlimited channels, connections and message rates
      - 99.999% uptime SLA with rebate options
      - 24/7 mission-critical support
      - HIPAA BAA, SSO, SCIM, dedicated infra
      - Committed-use discounts available
    cta_url: https://ably.com/contact

