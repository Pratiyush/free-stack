name: Release Drafter
# release-drafter reads its config from the DEFAULT BRANCH only. We're on
# rebuild/astro; .github/release-drafter.yml hasn't yet been merged to master.
# Only run on master pushes + PRs until the cutover lands.
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize]
permissions:
  contents: write
  pull-requests: write
jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
