name: Release assets

on:
  release:
    types: [created]
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build flat exports + attach to release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Build release assets
        run: node scripts/build-release-assets.mjs

      - name: Resolve tag name
        id: tag
        run: |
          if [ -n "${GITHUB_REF#refs/tags/}" ] && [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure release exists, then upload missing assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          # Self-heal: create the release with assets attached atomically when
          # it doesn't exist yet. Atomic create works around the repo's
          # "immutable releases" rule — assets attached at creation time are OK,
          # but uploading later (even with --clobber) is blocked.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            NOTES_FILE="release-notes/$TAG.md"
            if [ -f "$NOTES_FILE" ]; then
              gh release create "$TAG" \
                --notes-file "$NOTES_FILE" \
                --title "$TAG" \
                dist-assets/index.json \
                dist-assets/services.md
            else
              gh release create "$TAG" \
                --generate-notes \
                --title "$TAG" \
                dist-assets/index.json \
                dist-assets/services.md
            fi
            exit 0
          fi
          # Release already exists. Check whether assets are already attached.
          # If they are, the immutable-release rule means we cannot replace
          # them — succeed silently (assets are present, that's the goal).
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name' || echo '')
          if echo "$ASSETS" | grep -q '^index.json$' && \
             echo "$ASSETS" | grep -q '^services.md$'; then
            echo "Assets already attached to $TAG (immutable). Nothing to do."
            exit 0
          fi
          # Some assets are missing — try to upload (works only if the release
          # isn't yet immutable, e.g. draft state).
          gh release upload "$TAG" \
            dist-assets/index.json \
            dist-assets/services.md
