name: Build rebuild/astro preview artifact

# Builds the Astro rebuild and uploads it as a workflow artifact so contributors
# can download and inspect the dist/ output. Deliberately does NOT call
# actions/deploy-pages because:
#  - The existing GH Pages site (master → docs/index.html) serves
#    freestack.is-a.dev. If this workflow auto-deployed, it would clobber
#    the production site every time we push to rebuild/astro.
#  - The preview-URL strategy is still open: we'll either point a staging
#    subdomain at Cloudflare Pages, or move to a sibling repo's Pages,
#    or keep the artifact-only flow. Decided post-Sprint 1.
#
# To trigger a manual full deploy (when the preview-URL strategy lands),
# add a deploy job that consumes the rebuild-preview artifact and
# uncomment the actions/deploy-pages step.

on:
  push:
    branches: [rebuild/astro]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-preview
  cancel-in-progress: false

jobs:
  build:
    name: Build Astro site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro site
        run: pnpm build

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-preview-${{ github.sha }}
          path: dist
          retention-days: 7
