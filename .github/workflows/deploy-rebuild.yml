name: Deploy rebuild/astro preview

# Deploys the Astro rebuild to a GitHub Pages preview path so contributors can
# review v0.x.y releases without disturbing the production MD-era site that
# serves freestack.is-a.dev from master. Cuts over at v0.5.0.

on:
  push:
    branches: [rebuild/astro]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-rebuild
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro site
        run: pnpm build

      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: rebuild-preview

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: rebuild-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: rebuild-preview
