name: CI

on:
  pull_request:
  push:
    branches: [master, rebuild/astro]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, validate, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Validate schema
        run: pnpm validate

      - name: Check logos
        run: pnpm check-logos

      - name: Audit services
        run: pnpm audit-services --no-http

      - name: Build
        run: pnpm build
