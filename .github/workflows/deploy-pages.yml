name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:
# NOTE: `main` was a short-lived rename-experiment branch; `master` is the
# canonical legacy branch that still hosts docs/index.html. This workflow
# deploys the v1.0.0 MD-era site at freestack.is-a.dev until the production
# cutover lands in story 5.14, at which point this workflow is retired.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
